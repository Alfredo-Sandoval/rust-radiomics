[package]
name = "radiomics-py"
description = "Python bindings for CPU radiomics feature extraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
radiomics.workspace = true
indexmap = "2"
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module"] }
pythonize = "0.30"

[build-dependencies]
pyo3-build-config = "0.30"

[dependencies.rayon]
version = "1.10"
