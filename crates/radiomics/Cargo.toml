[package]
name = "radiomics"
description = "Native CPU float64 radiomics feature extraction: ROI and voxel-map features, image filters and IBSI-checked results."
readme = "../../README.md"
keywords = ["radiomics", "medical-imaging", "ibsi", "texture", "nifti"]
categories = ["science", "multimedia::images"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ndarray = "0.16"
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1.10"
regex = "1"
rustfft = "6"
saphyr = { version = "0.4", default-features = false }
saphyr-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml_serde = "0.10.7"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
