[workspace]
resolver = "3"
members = ["crates/radiomics", "crates/radiomics-py"]
default-members = ["crates/radiomics"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Alfredo-Sandoval/rust-radiomics"
homepage = "https://github.com/Alfredo-Sandoval/rust-radiomics"
publish = false
authors = ["Joseph Sandoval", "Alfredo Sandoval Jr."]

[workspace.dependencies]
radiomics = { path = "crates/radiomics" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
